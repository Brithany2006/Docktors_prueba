<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Laboratorio Doktors</title>

    <base href="/" />
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <link href="css/app.css" rel="stylesheet" />
</head>

<body>
    <div id="app">Cargando...</div>

    <script src="_framework/blazor.webassembly.js"></script>
    <script src="js/laboratorio.js"></script>
    <script src="js/site.js"></script>

    <script>
        window.abrirPdfDesdeBase64 = (base64, nombreArchivo) => {
            const pdfWindow = window.open("");
            if (!pdfWindow) {
                alert("❌ No se pudo abrir el PDF. Desactiva tu bloqueador de pop-ups.");
                return;
            }
            pdfWindow.document.write(
                `<iframe width='100%' height='100%' src='data:application/pdf;base64,${base64}'></iframe>`
            );
            pdfWindow.document.title = nombreArchivo || 'paciente.pdf';
        };

        window.descargarPdfDesdeBase64 = (base64, nombreArchivo) => {
            const link = document.createElement('a');
            link.href = 'data:application/pdf;base64,' + base64;
            link.download = nombreArchivo || 'paciente.pdf';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        window.triggerFileInputClick = (id) => {
            const el = document.getElementById(id);
            if (el) el.click();
        };
    </script>
</body>
</html>
