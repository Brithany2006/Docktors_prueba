<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Laboratorio Doktors</title>

    <base href="/" />

    <!-- 🧩 Fuentes y estilos -->
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', 
            theme: {
                extend: {
                    colors: {
                        turquesa: {
                            50: '#f0fdfc',
                            100: '#e6f7f6',
                            200: '#bce4e3',
                            300: '#7bcbc9',
                            400: '#5ab6b5',
                            500: '#44a1a0',
                            600: '#358a89',
                            700: '#2c7a7b',
                            800: '#236162',
                            900: '#0d5c63'
                        },
                        rojo: {
                            500: '#e63946',
                            700: '#c1121f'
                        }
                    },
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.1.1/model-viewer.min.js"></script>
    <script>
        window.downloadFileFromBytes = (fileName, contentType, byteBase64) => {
            const link = document.createElement('a');
            link.download = fileName;
            link.href = 'data:' + contentType + ';base64,' + byteBase64;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };
    </script>
</head>

<body>
    <div id="app">Cargando...</div>
    <!-- Blazor -->
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script>
        Blazor.start({
            loadBootResource: function (type, name, defaultUri, integrity) {
                const url = defaultUri + '?v=' + Date.now();
                // dotnet.js and other script resources MUST return a URI string
                if (type === 'dotnetjs') {
                    return url;
                }
                
                // For other resources, return a fetch promise without integrity checks
                return fetch(url, { 
                    cache: 'no-cache',
                    integrity: '' 
                });
            }
        });
    </script>

    <!-- Funciones JS -->
    <script src="js/laboratorio.js"></script>
    <script src="js/site.js"></script>

    <script>
        window.abrirPdfDesdeBase64 = (base64, nombreArchivo) => {
            const pdfWindow = window.open("");
            if (!pdfWindow) {
                alert("❌ No se pudo abrir el PDF. Desactiva tu bloqueador de pop-ups.");
                return;
            }
            pdfWindow.document.write(
                `<iframe width='100%' height='100%' src='data:application/pdf;base64,${base64}'></iframe>`
            );
            pdfWindow.document.title = nombreArchivo || 'paciente.pdf';
        };

        window.descargarPdfDesdeBase64 = (base64, nombreArchivo) => {
            const link = document.createElement('a');
            link.href = 'data:application/pdf;base64,' + base64;
            link.download = nombreArchivo || 'paciente.pdf';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        window.triggerFileInputClick = (id) => {
            const el = document.getElementById(id);
            if (el) el.click();
        };
    </script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script>
        window.cropperInstances = {};
        
        window.initCropper = (imgId, aspectRatio) => {
            const image = document.getElementById(imgId);
            if (!image) return;
            
            const startCropper = () => {
                if (window.cropperInstances[imgId]) {
                    window.cropperInstances[imgId].destroy();
                }
                window.cropperInstances[imgId] = new Cropper(image, {
                    aspectRatio: aspectRatio || 16 / 9,
                    viewMode: 1,
                });
            };
            
            if (image.complete) {
                startCropper();
            } else {
                image.onload = startCropper;
            }
        };
        
        window.getCroppedImage = (imgId) => {
            const cropper = window.cropperInstances[imgId];
            if (!cropper) return null;
            return cropper.getCroppedCanvas({
                width: 800,
                height: 400
            }).toDataURL("image/jpeg");
        };
        
        window.destroyCropper = (imgId) => {
            if (window.cropperInstances[imgId]) {
                window.cropperInstances[imgId].destroy();
                delete window.cropperInstances[imgId];
            }
        };
    </script>
</body>
</html>
